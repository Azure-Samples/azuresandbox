# CI: Terraform checks (formatting + tflint static analysis).
# Runs on ready (non-draft) pull requests targeting vnext and on pushes to vnext.
# sandbox-deployment.yml also calls it (workflow_call) to check the exact head
# SHA and full diff of a vnext -> main release PR before any deployment.
name: ci-terraform

on:
  pull_request:
    branches: [vnext]
    # Drafts do not run checks (see the draft guard below); ready_for_review
    # starts a fresh run when a draft is marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [vnext]
  workflow_dispatch:
  # Release mode: called by sandbox-deployment.yml for a vnext -> main release PR.
  workflow_call:
    inputs:
      head_sha:
        description: Release PR head commit SHA to check.
        type: string
        required: true
      base_sha:
        description: Release PR base (main) commit SHA captured with the event.
        type: string
        required: true
    outputs:
      verdict:
        description: pass, not-applicable, or fail.
        value: ${{ jobs.gate.outputs.verdict }}
      head_sha:
        description: Head SHA the verdict applies to.
        value: ${{ jobs.gate.outputs.head_sha }}

permissions:
  contents: read
  # Required by the `changes` job's paths-filter to read changed files via the
  # PR API on pull_request events.
  pull-requests: read

concurrency:
  # In release mode github.workflow/github.ref resolve to the caller and main,
  # so key on the PR number and head SHA to keep release attempts separate.
  group: ci-terraform-${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('release-{0}-{1}', github.event.pull_request.number, inputs.head_sha) || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this push/PR touches Terraform. The real jobs below are gated
  # on this so they only do work when relevant files change. Single-job checks
  # (fmt, tflint) are *skipped* (not absent) when nothing matches: a skipped
  # required job whose check name matches the required context satisfies branch
  # protection, whereas a path-filtered workflow that never runs would leave a
  # required check pending forever. Do NOT convert this to a trigger-level
  # `paths:` filter while these checks are required on vnext.
  # NOTE: the `validate` job is a *matrix* job and is handled differently — see
  # the comment on that job for why it must always run rather than be skipped.
  # Note: .terraform.lock.hcl is intentionally omitted — it is gitignored in this
  # repo and never committed.
  changes:
    name: detect changes
    # Draft PRs run no checks; every job below needs this one, so they skip too.
    # Drafts cannot merge, and marking the PR ready starts a fresh run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      # Release mode: diff the full release (everything vnext adds since its
      # merge base with main), not just the last commit. A soft reset to the
      # merge base stages that diff so `base: HEAD` below compares it locally,
      # instead of the PR files API the action would otherwise use.
      - name: Stage full release diff
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid release SHA input.'; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo '::error::Checked-out commit is not the release head.'; exit 1; }
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Comparing $HEAD_SHA against merge base $merge_base"
          git reset --soft "$merge_base"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Empty (default behavior) except in release mode; see the step above.
          base: ${{ github.event_name == 'pull_request_target' && 'HEAD' || '' }}
          filters: |
            terraform:
              - '**/*.tf'
              - '**/*.tf.json'
              - '**/.tflint.hcl'
              - '.github/workflows/ci-terraform.yml'

  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Matches required_version (~> 1.16.5) in terraform.tf.
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    env:
      # Used by `tflint --init` to download the azurerm ruleset plugin from
      # GitHub releases without hitting unauthenticated rate limits.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      # Each directory that contains a .tflint.hcl may pin a different plugin
      # version, so initialize plugins for every config before linting
      # recursively (`tflint --init` only initializes the current directory).
      - name: Init tflint plugins
        run: |
          for dir in $(find . -name .tflint.hcl -printf '%h\n' | sort -u); do
            echo "tflint --init in $dir"
            tflint --init --chdir="$dir"
          done

      # Recursively lints the root module and every child module.
      - name: Run tflint
        run: tflint --recursive

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    needs: changes
    # Unlike the single-job checks above, this is a *matrix* job, so its
    # branch-protection contexts are the matrix-expanded names
    # `terraform validate (.)` and
    # `terraform validate (extras/configurations/rg-devops-iac)`.
    # A job-level `if` skip would collapse the matrix into a single skipped
    # `terraform validate` check, so those two required contexts would NEVER be
    # reported and a non-Terraform PR would wait on them forever ("Expected —
    # Waiting for status to be reported"). Therefore this job must ALWAYS run so
    # the matrix expands and both contexts report; the per-step `if` below
    # no-ops the actual work when Terraform is unchanged. Do NOT reintroduce a
    # job-level `if` here.
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a root configuration (has its own provider blocks).
        # Child modules under modules/ and extras/modules/ are validated
        # transitively when the root configs that call them are validated.
        dir:
          - .
          - extras/configurations/rg-devops-iac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.terraform == 'true' }}
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: ${{ needs.changes.outputs.terraform == 'true' }}
        with:
          # Matches required_version (~> 1.16.5) in terraform.tf.
          terraform_version: 1.16.5
          terraform_wrapper: false

      # -backend=false downloads providers/initializes modules without
      # configuring remote state, so validation needs no Azure credentials.
      - name: terraform init (no backend)
        if: ${{ needs.changes.outputs.terraform == 'true' }}
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: terraform validate
        if: ${{ needs.changes.outputs.terraform == 'true' }}
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

  # Release mode only: turn the job results above into one explicit verdict
  # for sandbox-deployment.yml. "pass" needs every applicable check to
  # succeed; "not-applicable" needs change detection to succeed and prove the
  # filters match nothing, with the path-gated checks skipped. Anything else
  # (failed, cancelled, missing, or unexpectedly skipped) is "fail".
  gate:
    name: release gate
    needs: [changes, fmt, tflint, validate]
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head_sha: ${{ steps.verdict.outputs.head_sha }}
    steps:
      - name: Decide verdict
        id: verdict
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.terraform }}
          GATED_RESULTS: ${{ needs.fmt.result }} ${{ needs.tflint.result }}
          ALWAYS_RESULTS: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          verdict=fail
          all_are() { local want=$1; shift; for r in "$@"; do [ "$r" = "$want" ] || return 1; done; }
          read -ra gated <<< "$GATED_RESULTS"
          read -ra always <<< "$ALWAYS_RESULTS"
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Invalid release head SHA.'
          elif [ "$CHANGES_RESULT" != success ]; then
            echo "::error::Change detection did not succeed ($CHANGES_RESULT)."
          elif ! all_are success "${always[@]}"; then
            echo "::error::An always-applicable check did not succeed: $ALWAYS_RESULTS"
          elif [ "$APPLICABLE" = true ] && all_are success "${gated[@]}"; then
            verdict=pass
          elif [ "$APPLICABLE" = false ] && all_are skipped "${gated[@]}"; then
            verdict=not-applicable
          else
            echo "::error::Unexpected results (applicable=$APPLICABLE): $GATED_RESULTS"
          fi
          echo "Verdict for $HEAD_SHA: $verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          [ "$verdict" != fail ]
