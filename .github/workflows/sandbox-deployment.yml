name: Azure Sandbox deployment
run-name: Sandbox sandbox-${{ github.run_id }} / ${{ github.event_name == 'pull_request_target' && 'unit-test' || inputs.run_through }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      run_through:
        description: Run through this stage
        type: choice
        options: [preflight, apply, unit-test]
        default: preflight

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  selection:
    name: Validate deployment entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    concurrency:
      group: sandbox-deployment-status-${{ github.event.pull_request.head.sha || github.run_id }}
      cancel-in-progress: false
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      source_ref: ${{ steps.select.outputs.source_ref }}
      run_through: ${{ steps.select.outputs.run_through }}
      environment: ${{ steps.select.outputs.environment }}
    steps:
      # No checkout or environment secrets until the event is eligible.
      - name: Select trusted deployment path
        id: select
        env:
          MANUAL_RUN_THROUGH: ${{ inputs.run_through }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run the registered workflow in the trusted main context."
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              case "$MANUAL_RUN_THROUGH" in
                preflight|apply|unit-test) ;;
                *) echo "::error::Invalid manual stage selection."; exit 1 ;;
              esac
              {
                echo "source_ref=vnext"
                echo "run_through=$MANUAL_RUN_THROUGH"
                echo "environment=sandbox-deployment"
                echo "deploy=true"
              } >> "$GITHUB_OUTPUT"
              ;;
            pull_request_target)
              if ! jq -e --arg repository "$GITHUB_REPOSITORY" '
                .pull_request.base.repo.full_name == $repository and
                .pull_request.base.ref == "main" and
                .pull_request.head.repo.full_name == $repository and
                .pull_request.head.ref == "vnext" and
                (.pull_request.head.sha | type == "string" and test("^[0-9a-f]{40}$")) and
                (.pull_request.draft | type == "boolean")
              ' "$GITHUB_EVENT_PATH" > /dev/null; then
                echo "::error::Only same-repository vnext to main release PRs are eligible."
                exit 1
              fi
              action="$(jq -er '.action' "$GITHUB_EVENT_PATH")"
              case "$action" in
                opened|reopened|synchronize|ready_for_review|edited) ;;
                *) echo "::error::Unsupported release PR activity."; exit 1 ;;
              esac
              if jq -e '.pull_request.draft == true' "$GITHUB_EVENT_PATH" > /dev/null ||
                { [[ "$action" == edited ]] && ! jq -e '.changes.base.ref? != null' "$GITHUB_EVENT_PATH" > /dev/null; }; then
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                echo "No deployment requested: draft PR or metadata-only edit." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              head_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
                -f context=sandbox-deployment-gate \
                -f state=pending \
                -f description="Awaiting approval and the full deployment result." \
                -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
                --silent
              {
                printf 'source_ref=%s\n' "$head_sha"
                echo "run_through=unit-test"
                echo "environment=sandbox-release-gate"
                echo "deploy=true"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported deployment event."
              exit 1
              ;;
          esac

  sandbox:
    name: Sandbox preflight / apply / unit-test
    needs: selection
    if: ${{ needs.selection.outputs.deploy == 'true' }}
    concurrency:
      group: azure-sandbox-deployment
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, azuresandbox]
    environment:
      name: ${{ needs.selection.outputs.environment }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    timeout-minutes: 180
    env:
      SANDBOX_RUN_THROUGH: ${{ needs.selection.outputs.run_through }}
      SANDBOX_SOURCE_SHA: ${{ github.event_name == 'pull_request_target' && needs.selection.outputs.source_ref || '' }}
    outputs:
      preflight_outcome: ${{ steps.preflight.outcome }}
      apply_outcome: ${{ steps.apply.outcome }}
      unit_test_outcome: ${{ steps.unit_test.outcome }}
      evidence_ready: ${{ steps.unit_test.outputs.ready }}
      tests_passed: ${{ steps.unit_test.outputs.tests_passed }}
      artifact_outcome: ${{ steps.upload_evidence.outcome }}
      artifact_url: ${{ steps.upload_evidence.outputs.artifact-url }}
      report_outcome: ${{ steps.report.outcome }}
    steps:
      - name: Repository workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.selection.outputs.source_ref }}
          persist-credentials: false

      - name: Preflight
        id: preflight
        env:
          SANDBOX_BACKEND_HCL: ${{ secrets.SANDBOX_BACKEND_HCL }}
          SANDBOX_TFVARS_HCL: ${{ secrets.SANDBOX_TFVARS_HCL }}
        run: bash extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.sh preflight

      - name: Apply
        id: apply
        if: ${{ success() && env.SANDBOX_RUN_THROUGH != 'preflight' }}
        run: bash extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.sh apply

      - name: Unit-test
        id: unit_test
        if: ${{ success() && env.SANDBOX_RUN_THROUGH == 'unit-test' }}
        run: bash extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.sh unit-test

      - name: Publish sanitized unit-test evidence
        id: upload_evidence
        if: ${{ always() && steps.unit_test.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.unit_test.outputs.name }}
          path: ${{ steps.unit_test.outputs.json_path }}
          if-no-files-found: error

      - name: Report stage results
        id: report
        if: ${{ always() }}
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit_test.outcome }}
          UNIT_TEST_ARTIFACT_OUTCOME: ${{ steps.upload_evidence.outcome }}
          UNIT_TEST_ARTIFACT_URL: ${{ steps.upload_evidence.outputs.artifact-url }}
        run: |
          if [[ -f extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.sh ]]; then
            bash extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.sh summary
          else
            printf '## Sandbox deployment\n\nSource checkout did not provide the deployment helper. No completed stages are confirmed.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  deployment_status:
    name: Publish release deployment status
    needs: [selection, sandbox]
    if: ${{ always() && github.event_name == 'pull_request_target' && needs.selection.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    concurrency:
      group: sandbox-deployment-status-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    steps:
      - name: Publish fail-closed result on the candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.selection.outputs.source_ref }}
          DEPLOYMENT_RESULT: ${{ needs.sandbox.result }}
          PREFLIGHT_OUTCOME: ${{ needs.sandbox.outputs.preflight_outcome }}
          APPLY_OUTCOME: ${{ needs.sandbox.outputs.apply_outcome }}
          UNIT_TEST_OUTCOME: ${{ needs.sandbox.outputs.unit_test_outcome }}
          EVIDENCE_READY: ${{ needs.sandbox.outputs.evidence_ready }}
          TESTS_PASSED: ${{ needs.sandbox.outputs.tests_passed }}
          ARTIFACT_OUTCOME: ${{ needs.sandbox.outputs.artifact_outcome }}
          ARTIFACT_URL: ${{ needs.sandbox.outputs.artifact_url }}
          REPORT_OUTCOME: ${{ needs.sandbox.outputs.report_outcome }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release candidate SHA; no passing status was published."
            exit 1
          fi
          attempt_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          latest_url="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/status" \
            --jq '[.statuses[] | select(.context == "sandbox-deployment-gate")][0].target_url // empty')"
          # Both status writers share a lock; older attempts cannot overwrite a newer pending result.
          if [[ "$latest_url" != "$attempt_url" ]]; then
            echo "This attempt no longer owns the candidate status; no result was overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          state=failure
          description="Deployment failed or incomplete. The PR remains open."
          if [[ "$DEPLOYMENT_RESULT" == success &&
                "$PREFLIGHT_OUTCOME" == success &&
                "$APPLY_OUTCOME" == success &&
                "$UNIT_TEST_OUTCOME" == success &&
                "$EVIDENCE_READY" == true &&
                "$TESTS_PASSED" == true &&
                "$ARTIFACT_OUTCOME" == success &&
                -n "$ARTIFACT_URL" &&
                "$REPORT_OUTCOME" == success ]]; then
            state=success
            description="Preflight, apply, tests and JSON publication passed."
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f context=sandbox-deployment-gate \
            -f state="$state" \
            -f description="$description" \
            -f target_url="$attempt_url" \
            --silent
          printf '## Release deployment status\n\nsandbox-deployment-gate: **%s** on %s.\n\n%s\n' \
            "$state" "$SOURCE_SHA" "$description" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$state" != success ]]; then
            echo "::error::Full deployment and published passing JSON evidence are required. The PR remains open."
            exit 1
          fi
