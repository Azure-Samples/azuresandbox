name: Azure Sandbox deployment
run-name: Sandbox ${{ inputs.deployment_mode == 'new' && format('sandbox-{0}', github.run_id) || inputs.deployment_id }} / ${{ inputs.run_through }}

on:
  workflow_dispatch:
    inputs:
      run_through:
        description: Run through this stage
        type: choice
        options: [preflight, apply, unit-test]
        default: preflight
      deployment_mode:
        description: Explicitly select a new or existing Sandbox
        type: choice
        options: [existing, new]
        default: existing
      deployment_id:
        description: Existing Sandbox ID (sandbox-<initial-run-id>); leave empty for new
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: azure-sandbox-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sandbox:
    name: Sandbox preflight / apply / unit-test
    runs-on: [self-hosted, linux, x64, azuresandbox]
    environment:
      name: sandbox-deployment
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    timeout-minutes: 180
    env:
      SANDBOX_RUN_THROUGH: ${{ inputs.run_through }}
      SANDBOX_DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      SANDBOX_EXISTING_ID: ${{ inputs.deployment_id }}
    steps:
      - name: Check out the approved Sandbox source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: vnext
          persist-credentials: false

      - name: Preflight
        id: preflight
        env:
          SANDBOX_BACKEND_HCL: ${{ secrets.SANDBOX_BACKEND_HCL }}
          SANDBOX_TFVARS_HCL: ${{ secrets.SANDBOX_TFVARS_HCL }}
        run: python3 extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.py preflight

      - name: Apply
        id: apply
        if: ${{ success() && inputs.run_through != 'preflight' }}
        run: python3 extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.py apply

      - name: Unit-test
        id: unit_test
        if: ${{ success() && inputs.run_through == 'unit-test' }}
        run: python3 extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.py unit-test

      - name: Prepare sanitized unit-test evidence
        id: evidence
        if: ${{ always() && (steps.unit_test.outcome == 'success' || steps.unit_test.outcome == 'failure') }}
        run: python3 extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.py evidence

      - name: Publish sanitized unit-test evidence
        id: upload_evidence
        if: ${{ always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: |
            ${{ steps.evidence.outputs.json_path }}
            ${{ steps.evidence.outputs.xml_path }}
          if-no-files-found: error

      - name: Report stage results
        if: ${{ always() }}
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit_test.outcome }}
          UNIT_TEST_ARTIFACT_OUTCOME: ${{ steps.upload_evidence.outcome }}
          UNIT_TEST_ARTIFACT_URL: ${{ steps.upload_evidence.outputs.artifact-url }}
        run: |
          if [[ -f extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.py ]]; then
            python3 extras/configurations/rg-devops-iac/scripts/Invoke-SandboxDeployment.py summary
          else
            printf '## Sandbox deployment\n\nSource checkout did not provide the deployment helper. No completed stages are confirmed.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
