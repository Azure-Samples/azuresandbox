# CI: secret scanning (gitleaks).
# Catches credentials accidentally committed to the tree, complementing the
# .gitignore rules for *.tfvars, *.pem, *.pfx and *.tfstate*.
# Runs on ready (non-draft) pull requests targeting vnext and on pushes to vnext.
# sandbox-deployment.yml also calls it (workflow_call) to check the exact head
# SHA and full diff of a vnext -> main release PR before any deployment.
name: ci-secrets

on:
  pull_request:
    branches: [vnext]
    # Drafts do not run checks (see the draft guard below); ready_for_review
    # starts a fresh run when a draft is marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [vnext]
  workflow_dispatch:
  # Release mode: called by sandbox-deployment.yml for a vnext -> main release PR.
  workflow_call:
    inputs:
      head_sha:
        description: Release PR head commit SHA to check.
        type: string
        required: true
      base_sha:
        description: Release PR base (main) commit SHA captured with the event.
        type: string
        required: true
    # Raw job results; the Release static CI job in sandbox-deployment.yml
    # decides pass, not-applicable, or fail from them.
    outputs:
      changes:
        description: Result of change detection.
        value: ${{ jobs.report.outputs.changes }}
      applicable:
        description: Whether the path filters matched (true or false).
        value: ${{ jobs.report.outputs.applicable }}
      gated:
        description: Space-separated results of the path-gated checks.
        value: ${{ jobs.report.outputs.gated }}
      always:
        description: Space-separated results of the always-run checks.
        value: ${{ jobs.report.outputs.always }}

permissions:
  contents: read

concurrency:
  # In release mode github.workflow/github.ref resolve to the caller and main,
  # so key on the PR number and head SHA to keep release attempts separate.
  group: ci-secrets-${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('release-{0}-{1}', github.event.pull_request.number, inputs.head_sha) || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    # Draft PRs run no checks. Drafts cannot merge, and marking the PR ready
    # starts a fresh run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      # Pinned for deterministic, reproducible scans. Bump intentionally.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      # Download the pinned gitleaks release directly (no Marketplace action,
      # which would require a GITLEAKS_LICENSE for organization repos) and
      # verify its checksum before use.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$base/$tarball" -o "$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # Scan the checked-out working tree (`dir`) so secrets present in the PR's
      # files are caught regardless of git history depth. --redact keeps secret
      # values out of the logs; gitleaks exits non-zero when any leak is found.
      - name: Run gitleaks
        run: ./gitleaks dir . --redact --verbose --no-banner

  # Release mode only: pass the raw job results back to sandbox-deployment.yml.
  # This job has no logic; the Release static CI job there applies the one
  # pass / not-applicable / fail rule to all six workflows.
  report:
    name: release report
    needs: [gitleaks]
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    outputs:
      changes: 'success'
      applicable: 'true'
      gated: ''
      always: ${{ needs.gitleaks.result }}
    steps:
      - name: Show results
        env:
          CHANGES: 'success'
          APPLICABLE: 'true'
          GATED: ''
          ALWAYS: ${{ needs.gitleaks.result }}
        run: echo "changes=$CHANGES applicable=$APPLICABLE gated=[$GATED] always=[$ALWAYS]"
