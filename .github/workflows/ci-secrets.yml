# CI: secret scanning (gitleaks).
# Catches credentials accidentally committed to the tree, complementing the
# .gitignore rules for *.tfvars, *.pem, *.pfx and *.tfstate*.
# Runs on ready (non-draft) pull requests targeting vnext and on pushes to vnext.
# sandbox-deployment.yml also calls it (workflow_call) to check the exact head
# SHA and full diff of a vnext -> main release PR before any deployment.
name: ci-secrets

on:
  pull_request:
    branches: [vnext]
    # Drafts do not run checks (see the draft guard below); ready_for_review
    # starts a fresh run when a draft is marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [vnext]
  workflow_dispatch:
  # Release mode: called by sandbox-deployment.yml for a vnext -> main release PR.
  workflow_call:
    inputs:
      head_sha:
        description: Release PR head commit SHA to check.
        type: string
        required: true
      base_sha:
        description: Release PR base (main) commit SHA captured with the event.
        type: string
        required: true
    outputs:
      verdict:
        description: pass, not-applicable, or fail.
        value: ${{ jobs.gate.outputs.verdict }}
      head_sha:
        description: Head SHA the verdict applies to.
        value: ${{ jobs.gate.outputs.head_sha }}

permissions:
  contents: read

concurrency:
  # In release mode github.workflow/github.ref resolve to the caller and main,
  # so key on the PR number and head SHA to keep release attempts separate.
  group: ci-secrets-${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('release-{0}-{1}', github.event.pull_request.number, inputs.head_sha) || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    # Draft PRs run no checks. Drafts cannot merge, and marking the PR ready
    # starts a fresh run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      # Pinned for deterministic, reproducible scans. Bump intentionally.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      # Download the pinned gitleaks release directly (no Marketplace action,
      # which would require a GITLEAKS_LICENSE for organization repos) and
      # verify its checksum before use.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$base/$tarball" -o "$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # Scan the checked-out working tree (`dir`) so secrets present in the PR's
      # files are caught regardless of git history depth. --redact keeps secret
      # values out of the logs; gitleaks exits non-zero when any leak is found.
      - name: Run gitleaks
        run: ./gitleaks dir . --redact --verbose --no-banner

  # Release mode only: turn the job results above into one explicit verdict
  # for sandbox-deployment.yml. "pass" needs every applicable check to
  # succeed; "not-applicable" needs change detection to succeed and prove the
  # filters match nothing, with the path-gated checks skipped. Anything else
  # (failed, cancelled, missing, or unexpectedly skipped) is "fail".
  gate:
    name: release gate
    needs: [gitleaks]
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      head_sha: ${{ steps.verdict.outputs.head_sha }}
    steps:
      - name: Decide verdict
        id: verdict
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          # gitleaks always applies, so there is no change detection to check.
          CHANGES_RESULT: success
          APPLICABLE: 'true'
          GATED_RESULTS: ''
          ALWAYS_RESULTS: ${{ needs.gitleaks.result }}
        run: |
          set -euo pipefail
          verdict=fail
          all_are() { local want=$1; shift; for r in "$@"; do [ "$r" = "$want" ] || return 1; done; }
          read -ra gated <<< "$GATED_RESULTS"
          read -ra always <<< "$ALWAYS_RESULTS"
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Invalid release head SHA.'
          elif [ "$CHANGES_RESULT" != success ]; then
            echo "::error::Change detection did not succeed ($CHANGES_RESULT)."
          elif ! all_are success "${always[@]}"; then
            echo "::error::An always-applicable check did not succeed: $ALWAYS_RESULTS"
          elif [ "$APPLICABLE" = true ] && all_are success "${gated[@]}"; then
            verdict=pass
          elif [ "$APPLICABLE" = false ] && all_are skipped "${gated[@]}"; then
            verdict=not-applicable
          else
            echo "::error::Unexpected results (applicable=$APPLICABLE): $GATED_RESULTS"
          fi
          echo "Verdict for $HEAD_SHA: $verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          [ "$verdict" != fail ]
