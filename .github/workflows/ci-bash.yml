# CI: bash static analysis (ShellCheck).
# Lints every *.sh in the tree, failing on warning- and error-severity findings.
# The bash analogue of ci-powershell.yml (PSScriptAnalyzer). Rule configuration
# (per-rule excludes, external-sources) lives in the repo-root .shellcheckrc; the
# warning+error gate is applied via the --severity flag below. Developers can run
# the identical check locally with scripts/Invoke-ShellCheck.sh.
# Runs on ready (non-draft) pull requests targeting vnext and on pushes to vnext.
# sandbox-deployment.yml also calls it (workflow_call) to check the exact head
# SHA and full diff of a vnext -> main release PR before any deployment.
name: ci-bash

on:
  pull_request:
    branches: [vnext]
    # Drafts do not run checks (see the draft guard below); ready_for_review
    # starts a fresh run when a draft is marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [vnext]
  workflow_dispatch:
  # Release mode: called by sandbox-deployment.yml for a vnext -> main release PR.
  workflow_call:
    inputs:
      head_sha:
        description: Release PR head commit SHA to check.
        type: string
        required: true
      base_sha:
        description: Release PR base (main) commit SHA captured with the event.
        type: string
        required: true
    # Raw job results; the Release static CI job in sandbox-deployment.yml
    # decides pass, not-applicable, or fail from them.
    outputs:
      changes:
        description: Result of change detection.
        value: ${{ jobs.report.outputs.changes }}
      applicable:
        description: Whether the path filters matched (true or false).
        value: ${{ jobs.report.outputs.applicable }}
      gated:
        description: Space-separated results of the path-gated checks.
        value: ${{ jobs.report.outputs.gated }}
      always:
        description: Space-separated results of the always-run checks.
        value: ${{ jobs.report.outputs.always }}

permissions:
  contents: read
  # Required by the `changes` job's paths-filter to read changed files via the
  # PR API on pull_request events.
  pull-requests: read

concurrency:
  # In release mode github.workflow/github.ref resolve to the caller and main,
  # so key on the PR number and head SHA to keep release attempts separate.
  group: ci-bash-${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('release-{0}-{1}', github.event.pull_request.number, inputs.head_sha) || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this push/PR touches shell scripts. The real job is gated on
  # this so it only runs when relevant files change. A skipped required job
  # satisfies branch protection, whereas a path-filtered workflow that never runs
  # would leave a required check pending forever. Do NOT convert this to a
  # trigger-level `paths:` filter while ShellCheck is a required check on vnext.
  changes:
    name: detect changes
    # Draft PRs run no checks; every job below needs this one, so they skip too.
    # Drafts cannot merge, and marking the PR ready starts a fresh run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      bash: ${{ steps.filter.outputs.bash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      # Release mode: diff the full release (everything vnext adds since its
      # merge base with main), not just the last commit. A soft reset to the
      # merge base stages that diff so `base: HEAD` below compares it locally,
      # instead of the PR files API the action would otherwise use.
      - name: Stage full release diff
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid release SHA input.'; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo '::error::Checked-out commit is not the release head.'; exit 1; }
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Comparing $HEAD_SHA against merge base $merge_base"
          git reset --soft "$merge_base"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Empty (default behavior) except in release mode; see the step above.
          base: ${{ github.event_name == 'pull_request_target' && 'HEAD' || '' }}
          filters: |
            bash:
              - '**/*.sh'
              - '.shellcheckrc'
              - '.github/workflows/ci-bash.yml'

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.bash == 'true' }}
    env:
      # Pinned for deterministic, reproducible scans. Bump intentionally.
      SHELLCHECK_VERSION: 0.11.0
      # SHA256 of shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz from the
      # official koalaman/shellcheck release. Update when bumping the version.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      # Download the pinned ShellCheck release directly (no Marketplace action) and
      # verify its checksum before use, mirroring the gitleaks install in ci-secrets.yml.
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          curl -fsSL "$url" -o "$tarball"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Lint every *.sh in the tree (excluding .git). Severity is set here; other
      # rule config comes from the repo-root .shellcheckrc. ShellCheck exits
      # non-zero when any finding at or above the threshold is reported.
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          mapfile -d '' -t scripts < <(find . -name '*.sh' -not -path './.git/*' -print0)
          printf 'Linting %d shell script(s)...\n' "${#scripts[@]}"
          if ! shellcheck --severity=warning "${scripts[@]}"; then
            echo "::error::ShellCheck found warning/error-severity issue(s)."
            exit 1
          fi
          echo 'ShellCheck: no issues found.'

  # Release mode only: pass the raw job results back to sandbox-deployment.yml.
  # This job has no logic; the Release static CI job there applies the one
  # pass / not-applicable / fail rule to all six workflows.
  report:
    name: release report
    needs: [changes, shellcheck]
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ needs.changes.result }}
      applicable: ${{ needs.changes.outputs.bash }}
      gated: ${{ needs.shellcheck.result }}
      always: ''
    steps:
      - name: Show results
        env:
          CHANGES: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.bash }}
          GATED: ${{ needs.shellcheck.result }}
          ALWAYS: ''
        run: echo "changes=$CHANGES applicable=$APPLICABLE gated=[$GATED] always=[$ALWAYS]"
