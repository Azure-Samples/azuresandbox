# CI: tool-version drift detection.
# Dependabot (.github/dependabot.yml) covers only the terraform and
# github-actions ecosystems, so every pinned CI linter/scanner *tool* version is
# unmonitored: each is pinned as a direct binary download gated by an env-var
# version, an Install-Module / npx inline invocation with no manifest, or an
# input to a setup action (Dependabot bumps the action ref, not its inputs).
# This scheduled workflow closes that gap. scripts/Check-ToolVersionDrift.sh
# compares each pinned version against its upstream latest stable release; when
# anything is behind it opens (or updates) a SINGLE tracking issue, and closes
# that issue automatically once every tool is back in sync.
name: ci-tool-versions

on:
  schedule:
    # Weekly, Mondays 08:30 UTC — after the Dependabot terraform/actions runs.
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-tool-versions-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift:
    name: detect tool-version drift
    runs-on: ubuntu-latest
    env:
      # Used by Check-ToolVersionDrift.sh for authenticated GitHub Releases API
      # calls (avoids unauthenticated rate limits) and by gh for issue management.
      GH_TOKEN: ${{ github.token }}
      # Label used to find the one existing tracking issue across runs.
      DRIFT_LABEL: tool-version-drift
    steps:
      - uses: actions/checkout@v7

      - name: Check tool-version drift
        id: drift
        run: ./scripts/Check-ToolVersionDrift.sh "${RUNNER_TEMP}/drift-report.md"

      # Ensure the tracking label exists (idempotent) so the issue queries below
      # can rely on it. `gh label create` is a no-op if it already exists.
      - name: Ensure tracking label exists
        run: |
          set -euo pipefail
          gh label create "$DRIFT_LABEL" \
            --color BFD4F2 \
            --description "Pinned CI tool version(s) behind upstream latest" \
            --force > /dev/null 2>&1 || true

      # Open or update a single tracking issue when drift is detected, or close
      # the existing one when everything is back in sync. Idempotent across runs.
      - name: Manage tracking issue
        env:
          DRIFT_COUNT: ${{ steps.drift.outputs.drift_count }}
          ERROR_COUNT: ${{ steps.drift.outputs.error_count }}
          REPORT_FILE: ${{ steps.drift.outputs.report_file }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title='CI tool-version drift detected'

          # Find the most recent open tracking issue (if any) by label.
          existing="$(gh issue list --repo "$REPO" --state open \
            --label "$DRIFT_LABEL" --limit 1 --json number --jq '.[0].number // empty')"

          {
            cat "$REPORT_FILE"
            echo
            echo "---"
            echo "_Generated by [ci-tool-versions.yml](${RUN_URL}) on $(date -u '+%Y-%m-%d %H:%M UTC'). This issue is opened/updated/closed automatically; edits to the body may be overwritten on the next run._"
          } > "${RUNNER_TEMP}/issue-body.md"

          if [ "${DRIFT_COUNT:-0}" -gt 0 ] || [ "${ERROR_COUNT:-0}" -gt 0 ]; then
            if [ -n "$existing" ]; then
              echo "Updating tracking issue #$existing"
              gh issue edit "$existing" --repo "$REPO" \
                --body-file "${RUNNER_TEMP}/issue-body.md"
              gh issue comment "$existing" --repo "$REPO" \
                --body "🔁 Drift report refreshed by the weekly scan — see the updated issue body. ([run](${RUN_URL}))"
            else
              echo "Opening new tracking issue"
              gh issue create --repo "$REPO" \
                --title "$title" \
                --label "$DRIFT_LABEL" \
                --body-file "${RUNNER_TEMP}/issue-body.md"
            fi
          else
            if [ -n "$existing" ]; then
              echo "No drift — closing tracking issue #$existing"
              gh issue comment "$existing" --repo "$REPO" \
                --body "✅ All pinned CI tool versions are back in sync — closing automatically. ([run](${RUN_URL}))"
              gh issue close "$existing" --repo "$REPO" --reason completed
            else
              echo "No drift and no open tracking issue — nothing to do."
            fi
          fi
