# CI: documentation checks (markdownlint + lychee link checker).
# Runs on ready (non-draft) pull requests targeting vnext and on pushes to vnext.
# sandbox-deployment.yml also calls it (workflow_call) to check the exact head
# SHA and full diff of a vnext -> main release PR before any deployment.
name: ci-docs

on:
  pull_request:
    branches: [vnext]
    # Drafts do not run checks (see the draft guard below); ready_for_review
    # starts a fresh run when a draft is marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [vnext]
  workflow_dispatch:
  # Release mode: called by sandbox-deployment.yml for a vnext -> main release PR.
  workflow_call:
    inputs:
      head_sha:
        description: Release PR head commit SHA to check.
        type: string
        required: true
      base_sha:
        description: Release PR base (main) commit SHA captured with the event.
        type: string
        required: true
    # Raw job results; the Release static CI job in sandbox-deployment.yml
    # decides pass, not-applicable, or fail from them.
    outputs:
      changes:
        description: Result of change detection.
        value: ${{ jobs.report.outputs.changes }}
      applicable:
        description: Whether the path filters matched (true or false).
        value: ${{ jobs.report.outputs.applicable }}
      gated:
        description: Space-separated results of the path-gated checks.
        value: ${{ jobs.report.outputs.gated }}
      always:
        description: Space-separated results of the always-run checks.
        value: ${{ jobs.report.outputs.always }}

permissions:
  contents: read
  # Required by the `changes` job's paths-filter to read changed files via the
  # PR API on pull_request events.
  pull-requests: read

concurrency:
  # In release mode github.workflow/github.ref resolve to the caller and main,
  # so key on the PR number and head SHA to keep release attempts separate.
  group: ci-docs-${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('release-{0}-{1}', github.event.pull_request.number, inputs.head_sha) || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this push/PR touches documentation. The real jobs below are
  # gated on this so they only run when relevant files change. They `needs` this
  # job and are *skipped* (not absent) when nothing matches: a skipped required
  # job satisfies branch protection, whereas a path-filtered workflow that never
  # runs would leave a required check pending forever. Do NOT convert this to a
  # trigger-level `paths:` filter while these checks are required on vnext.
  changes:
    name: detect changes
    # Draft PRs run no checks; every job below needs this one, so they skip too.
    # Drafts cannot merge, and marking the PR ready starts a fresh run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      # Release mode: diff the full release (everything vnext adds since its
      # merge base with main), not just the last commit. A soft reset to the
      # merge base stages that diff so `base: HEAD` below compares it locally,
      # instead of the PR files API the action would otherwise use.
      - name: Stage full release diff
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid release SHA input.'; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo '::error::Checked-out commit is not the release head.'; exit 1; }
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Comparing $HEAD_SHA against merge base $merge_base"
          git reset --soft "$merge_base"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Empty (default behavior) except in release mode; see the step above.
          base: ${{ github.event_name == 'pull_request_target' && 'HEAD' || '' }}
          filters: |
            docs:
              - '**/*.md'
              - '.markdownlint.jsonc'
              - '.markdownlint-cli2.jsonc'
              - '.github/workflows/ci-docs.yml'

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          # No dependency cache: release mode runs with main's cache scope.
          package-manager-cache: false

      # Pinned to match the version the repo's .markdownlint(-cli2).jsonc was
      # validated against. Globs and ignores come from .markdownlint-cli2.jsonc;
      # rule configuration comes from .markdownlint.jsonc.
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.3

  lychee:
    name: lychee (internal links)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      # Offline mode only validates local/relative links (file existence);
      # external URLs are not requested, keeping the check fast and deterministic.
      - name: Link check (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  # Release mode only: pass the raw job results back to sandbox-deployment.yml.
  # This job has no logic; the Release static CI job there applies the one
  # pass / not-applicable / fail rule to all six workflows.
  report:
    name: release report
    needs: [changes, markdownlint, lychee]
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ needs.changes.result }}
      applicable: ${{ needs.changes.outputs.docs }}
      gated: ${{ needs.markdownlint.result }} ${{ needs.lychee.result }}
      always: ''
    steps:
      - name: Show results
        env:
          CHANGES: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.docs }}
          GATED: ${{ needs.markdownlint.result }} ${{ needs.lychee.result }}
          ALWAYS: ''
        run: echo "changes=$CHANGES applicable=$APPLICABLE gated=[$GATED] always=[$ALWAYS]"
