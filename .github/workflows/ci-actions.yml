# CI: GitHub Actions workflow linting (actionlint).
# Lints the workflow files themselves for syntax errors, bad expressions,
# deprecated runners, and shell-script issues in `run:` steps.
# Runs on ready (non-draft) pull requests targeting vnext or main and on pushes
# to vnext. For a vnext -> main release PR, sandbox-deployment.yml waits for this
# workflow's pull_request run on the PR head before any deployment.
name: ci-actions

on:
  pull_request:
    branches: [vnext, main]
    # Drafts do not run checks (see the draft guard below); ready_for_review
    # starts a fresh run when a draft is marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [vnext]
  workflow_dispatch:

permissions:
  contents: read
  # Required by the `changes` job's paths-filter to read changed files via the
  # PR API on pull_request events.
  pull-requests: read

concurrency:
  group: ci-actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this push/PR touches workflow files. The real job is gated on
  # this so it only runs when workflows change. A skipped required job satisfies
  # branch protection, whereas a path-filtered workflow that never runs would
  # leave a required check pending forever. Do NOT convert this to a trigger-level
  # `paths:` filter while actionlint is a required check on vnext.
  changes:
    name: detect changes
    # Draft PRs run no checks; every job below needs this one, so they skip too.
    # Drafts cannot merge, and marking the PR ready starts a fresh run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            actions:
              - '.github/workflows/**'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    env:
      # Pinned for deterministic, reproducible runs. Bump intentionally.
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Download the pinned actionlint release directly and verify its checksum
      # before use. shellcheck is preinstalled on ubuntu-latest, so actionlint
      # automatically lints shell in `run:` steps too.
      - name: Install actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$base/$tarball" -o "$tarball"
          curl -fsSL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      # actionlint discovers .github/workflows/*.yml on its own; -color makes
      # findings readable in the Actions log. Exits non-zero on any finding.
      - name: Run actionlint
        run: ./actionlint -color
