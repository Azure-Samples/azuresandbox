# CI: GitHub Actions workflow linting (actionlint).
# Lints the workflow files themselves for syntax errors, bad expressions,
# deprecated runners, and shell-script issues in `run:` steps, then tests the
# sandbox-deployment.yml entry selection (scripts/tests/Test-SandboxDeploymentSelection.sh).
# Runs on ready (non-draft) pull requests targeting vnext and on pushes to vnext.
# sandbox-deployment.yml also calls it (workflow_call) to check the exact head
# SHA and full diff of a vnext -> main release PR before any deployment.
name: ci-actions

on:
  pull_request:
    branches: [vnext]
    # Drafts do not run checks (see the draft guard below); ready_for_review
    # starts a fresh run when a draft is marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [vnext]
  workflow_dispatch:
  # Release mode: called by sandbox-deployment.yml for a vnext -> main release PR.
  workflow_call:
    inputs:
      head_sha:
        description: Release PR head commit SHA to check.
        type: string
        required: true
      base_sha:
        description: Release PR base (main) commit SHA captured with the event.
        type: string
        required: true
    # Raw job results; the Release static CI job in sandbox-deployment.yml
    # decides pass, not-applicable, or fail from them.
    outputs:
      changes:
        description: Result of change detection.
        value: ${{ jobs.report.outputs.changes }}
      applicable:
        description: Whether the path filters matched (true or false).
        value: ${{ jobs.report.outputs.applicable }}
      gated:
        description: Space-separated results of the path-gated checks.
        value: ${{ jobs.report.outputs.gated }}
      always:
        description: Space-separated results of the always-run checks.
        value: ${{ jobs.report.outputs.always }}

permissions:
  contents: read
  # Required by the `changes` job's paths-filter to read changed files via the
  # PR API on pull_request events.
  pull-requests: read

concurrency:
  # In release mode github.workflow/github.ref resolve to the caller and main,
  # so key on the PR number and head SHA to keep release attempts separate.
  group: ci-actions-${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('release-{0}-{1}', github.event.pull_request.number, inputs.head_sha) || github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this push/PR touches workflow files. The real job is gated on
  # this so it only runs when workflows change. A skipped required job satisfies
  # branch protection, whereas a path-filtered workflow that never runs would
  # leave a required check pending forever. Do NOT convert this to a trigger-level
  # `paths:` filter while actionlint is a required check on vnext.
  changes:
    name: detect changes
    # Draft PRs run no checks; every job below needs this one, so they skip too.
    # Drafts cannot merge, and marking the PR ready starts a fresh run.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      # Release mode: diff the full release (everything vnext adds since its
      # merge base with main), not just the last commit. A soft reset to the
      # merge base stages that diff so `base: HEAD` below compares it locally,
      # instead of the PR files API the action would otherwise use.
      - name: Stage full release diff
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid release SHA input.'; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo '::error::Checked-out commit is not the release head.'; exit 1; }
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Comparing $HEAD_SHA against merge base $merge_base"
          git reset --soft "$merge_base"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Empty (default behavior) except in release mode; see the step above.
          base: ${{ github.event_name == 'pull_request_target' && 'HEAD' || '' }}
          filters: |
            actions:
              - '.github/workflows/**'
              - 'scripts/tests/Test-SandboxDeploymentSelection.sh'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    env:
      # Pinned for deterministic, reproducible runs. Bump intentionally.
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty except in release mode, where it pins the release PR head.
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      # Download the pinned actionlint release directly and verify its checksum
      # before use. shellcheck is preinstalled on ubuntu-latest, so actionlint
      # automatically lints shell in `run:` steps too.
      - name: Install actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$base/$tarball" -o "$tarball"
          curl -fsSL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      # actionlint discovers .github/workflows/*.yml on its own; -color makes
      # findings readable in the Actions log. Exits non-zero on any finding.
      - name: Run actionlint
        run: ./actionlint -color

      # Runs the sandbox-deployment selection step against fixture events
      # (no GitHub or Azure access). Kept in this job so the existing required
      # actionlint check covers it. jq and python3 with PyYAML are preinstalled
      # on ubuntu-latest; the test fails explicitly if either is missing.
      - name: Test sandbox-deployment selection
        run: ./scripts/tests/Test-SandboxDeploymentSelection.sh

  # Release mode only: pass the raw job results back to sandbox-deployment.yml.
  # This job has no logic; the Release static CI job there applies the one
  # pass / not-applicable / fail rule to all six workflows.
  report:
    name: release report
    needs: [changes, actionlint]
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ needs.changes.result }}
      applicable: ${{ needs.changes.outputs.actions }}
      gated: ${{ needs.actionlint.result }}
      always: ''
    steps:
      - name: Show results
        env:
          CHANGES: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.actions }}
          GATED: ${{ needs.actionlint.result }}
          ALWAYS: ''
        run: echo "changes=$CHANGES applicable=$APPLICABLE gated=[$GATED] always=[$ALWAYS]"
